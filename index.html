<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pastel-pink': '#fdf2f8',
                        'rose-btn': '#e11d48',
                        'rose-hover': '#be123c',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pastel-pink min-h-screen font-sans text-gray-800 antialiased p-6 flex flex-col items-center">

    <header class="text-center mt-8 mb-10">
        <h1 class="text-4xl font-extrabold text-rose-500 mb-2 tracking-tight">Prompt Generator</h1>
        <p class="text-gray-500 text-lg">Discover story ideas and alternate universes for your favorite ship.</p>
    </header>

    <main class="w-full max-w-lg bg-white p-8 rounded-2xl shadow-[0_8px_30px_rgb(255,228,230,0.8)] border border-pink-100 mb-10 transition-all">
        
        <div class="mb-6">
            <label class="block text-sm font-semibold text-rose-900 mb-2">Upload Visual / Moodboard (Optional)</label>
            <div class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-pink-200 border-dashed rounded-xl cursor-pointer bg-pink-50 hover:bg-pink-100 transition-colors group overflow-hidden" id="upload-container">
                <input type="file" id="image-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                
                <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6 text-pink-400 group-hover:text-pink-500">
                    <svg class="w-8 h-8 mb-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="text-sm font-medium">Click or drag an image here</p>
                </div>

                <img id="upload-preview" src="" alt="Preview" class="hidden absolute inset-0 w-full h-full object-cover z-0 opacity-50" />
            </div>
        </div>

        <div class="mb-5">
            <label for="ship-select" class="block text-sm font-semibold text-rose-900 mb-2">Select Character / Ship</label>
            <select id="ship-select" class="w-full bg-pink-50 border border-pink-200 text-gray-700 text-md rounded-xl focus:ring-rose-300 focus:border-rose-300 block p-3 outline-none transition-shadow focus:shadow-md">
                <option value="Shinyu & Dohoon">Shinyu & Dohoon</option>
                <option value="Shinyu & Youngjae">Shinyu & Youngjae</option>
                <option value="Shinyu & Jihoon">Shinyu & Jihoon</option>
                <option value="Shinyu & Hanjin">Shinyu & Hanjin</option>
                <option value="Shinyu & Kyungmin">Shinyu & Kyungmin</option>
                
                <option value="Dohoon & Youngjae">Dohoon & Youngjae</option>
                <option value="Dohoon & Jihoon">Dohoon & Jihoon</option>
                <option value="Dohoon & Hanjin">Dohoon & Hanjin</option>
                <option value="Dohoon & Kyungmin">Dohoon & Kyungmin</option>
                
                <option value="Youngjae & Jihoon">Youngjae & Jihoon</option>
                <option value="Youngjae & Hanjin">Youngjae & Hanjin</option>
                <option value="Youngjae & Kyungmin">Youngjae & Kyungmin</option>
                
                <option value="Jihoon & Hanjin">Jihoon & Hanjin</option>
                <option value="Jihoon & Kyungmin">Jihoon & Kyungmin</option>
                
                <option value="Hanjin & Kyungmin">Hanjin & Kyungmin</option>
            </select>
        </div>

        <div class="mb-8">
            <label for="genre-select" class="block text-sm font-semibold text-rose-900 mb-2">Select Genre AU</label>
            <select id="genre-select" class="w-full bg-pink-50 border border-pink-200 text-gray-700 text-md rounded-xl focus:ring-rose-300 focus:border-rose-300 block p-3 outline-none transition-shadow focus:shadow-md">
                <option value="Fluff">Fluff</option>
                <option value="Angst">Angst</option>
                <option value="Coffee Shop AU">Coffee Shop AU</option>
                <option value="Enemies to Lovers">Enemies to Lovers</option>
                <option value="School AU">School AU</option>
                <option value="Office Worker AU">Office Worker AU</option>
                <option value="Fake Dating">Fake Dating</option>
                <option value="Soulmate AU">Soulmate AU</option>
            </select>
        </div>

        <button id="generate-btn" class="w-full bg-rose-btn hover:bg-rose-hover text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-rose-200 transition-all transform active:scale-95 text-lg flex justify-center items-center gap-2">
            Generate Prompt
        </button>
    </main>

    <section id="result-section" class="hidden w-full max-w-2xl bg-white rounded-2xl shadow-[0_8px_30px_rgb(255,228,230,0.8)] border border-pink-100 overflow-hidden mb-12">
        <div class="flex flex-col sm:flex-row">
            
            <div id="result-image-container" class="hidden sm:w-2/5 h-64 sm:h-auto overflow-hidden bg-pink-50">
                <img id="result-image" src="" alt="Moodboard" class="w-full h-full object-cover">
            </div>

            <div class="p-8 flex-1 flex flex-col justify-center">
                <div class="flex flex-wrap gap-2 mb-4">
                    <span id="badge-ship" class="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1 rounded-full border border-rose-200"></span>
                    <span id="badge-genre" class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full border border-pink-200"></span>
                </div>
                
                <h3 class="text-xl font-bold text-rose-900 mb-3">Scenario:</h3>
                <p id="prompt-text" class="text-gray-600 leading-relaxed italic text-md">
                </p>
            </div>
        </div>
    </section>

    <script>
        const promptsData = {
            "Fluff": [
                "They accidentally bumped into each other in the hallway, scattering their stacked notebooks everywhere. As they reached down to pick them up, their hands brushed, sending a sudden blush across both of their cheeks.",
                "It was freezing outside, and one of them forgot to bring a scarf. Without a word, the other unwraped their own thick scarf and gently wrapped it around the other's neck, keeping them warm through the chilly walk home.",
                "Spending a lazy Sunday afternoon together on the couch watching cartoons sounds ordinary, but when one of them falls asleep comfortably leaning on the other's shoulder, the whole world suddenly feels entirely complete.",
                "Sharing a single pair of earphones while walking under the falling autumn leaves, they listened to the same playlist in comfortable silence, occasionally stealing shy glances at each other.",
                "When one of them got sick with a sudden fever, the other stayed up all night acting as a clumsy yet extremely dedicated personal nurse, bringing warm soup and medicine with a soft, worried expression."
            ],
            "Angst": [
                "Heavy rain poured down, masking the tears they refused to let fall. Standing under the dim streetlamp, one watched the other walk away, realizing some stories are simply not meant to have a happy ending.",
                "Holding a concert ticket bought with months of hard effort, one stared at the empty seat next to them. Fate had other plans, leaving them alone in the roaring crowd with unexpressed words stuck in their throat.",
                "The text message was short, containing only a mutual agreement to let go. They both knew holding on any longer would only cause more damage, though the parting itself felt heavier than any physical wound.",
                "They stood on opposite sides of the platform as the train doors closed, separating their lives forever with a silent glass barrier and eyes full of unspoken apologies.",
                "Finding an old polaroid picture tucked inside a textbook brought back a flood of memories from a time when they used to mean everything to each other, before everything turned into cold strangers."
            ],
            "Coffee Shop AU": [
                "The rich aroma of roasted coffee beans marked their meeting every Tuesday afternoon. The order was always the same, just like the quiet smile from behind the counter, until today when a sweet phone number was written on the cup sleeve.",
                "The iced americano tasted far too bitter because the rookie barista messed up the espresso ratio. When complained, the barista panicked with flushed cheeks, offering a free strawberry cake and an awkward introduction.",
                "A sudden thunderstorm trapped the last customer inside the closing cafe. The owner brewed two cups of hot chocolate, leading to a late-night conversation that made them forget the bad weather outside.",
                "Drawing funny little doodles on every paper coffee cup became a secret game between the regular customer and the barista, until one day a reply was written back in marker.",
                "Working the closing shift alone, they spilled coffee all over the counter, bursting into helpless laughter that instantly broke the rigid professional barrier between them."
            ],
            "Enemies to Lovers": [
                "Being paired up for a major group project felt like a nightmare for two people who never stopped arguing. Yet, staying up late together to meet the deadline slowly broke down their defensive walls.",
                "A foolish lost bet forced them to pretend to be a couple for a whole week. What started as awkward acting and constant teasing slowly turned blurred as their hands naturally intertwined in public.",
                "Tired of the loud noises coming from the next apartment unit every weekend, one marched over to complain, only to find their ultimate campus rival struggling through a personal emergency.",
                "They were fierce competitors running against each other for student council president, but getting locked inside the storage room overnight forced them to actually listen to each other's hidden vulnerabilities.",
                "Constantly exchanging sarcastic remarks in class, they never expected to find themselves sharing midnight snacks on the school rooftop while talking about their deepest fears."
            ],
            "School AU": [
                "High school orientation felt utterly boring until spotting the bright smile of the photography club president. A candid snapshot taken from afar marked the beginning of countless moments under the shady school trees.",
                "Falling asleep in the library during lunch break always resulted in finding a cold strawberry milk and a sticky note with words of encouragement left on the desk. Today, they decided to fake sleep to catch the secret admirer.",
                "As top academic rivals always fighting for the first rank on the board, they secretly agreed to meet up at the school rooftop for late-night study sessions, turning grade competition into fast-beating heartbeats.",
                "Being assigned as partners for detention duty sounded like a punishment, but sharing a single box of snacks on the dusty floor made the hours pass by far too quickly.",
                "During a sudden school power outage, one of them reached out in the dark and accidentally grabbed the other's hand, refusing to let go even after the lights came back on."
            ],
            "Office Worker AU": [
                "Getting trapped inside a broken office elevator for two hours forced two coworkers who rarely got along to finally open up about their real life pressures and secret career ambitions.",
                "As a perfectionist junior manager, they were constantly annoyed by their seemingly laid-back yet brilliant senior. Behind stiff corporate reports, sticky notes with playful remarks were frequently slipped.",
                "Working overtime in an empty corporate building left just the two of them on the fourteenth floor. Warm coffee from the vending machine sparked a conversation that changed their working dynamic completely.",
                "A stressful corporate trip out of town required them to share a single hotel room with only one bed, turning a professional assignment into an awkward night of quiet realizations.",
                "When a major client presentation failed, they stayed back late to fix the slides together, sharing takeout food on the office floor while whispering words of mutual comfort."
            ],
            "Fake Dating": [
                "To escape exhausting family blind dates, they agreed to sign a fake dating contract. The primary rule was simple: do not catch feelings. Naturally, that rule began breaking down by the third day.",
                "Attending a high school reunion as a successful power couple managed to fool everyone in attendance. However, on the quiet taxi ride home, the silence felt far more intense than the act itself.",
                "A casual photo captured by a passing reporter turned them into nationwide trending news. Instead of issuing immediate denials, they decided to extend the romantic charade for mutual benefit.",
                "Playing lovers for a friend's wedding weekend seemed harmless, but slow dancing under the fairy lights made the fake scenario feel dangerously close to reality.",
                "They practiced their kissing scene for a local theater project backstage, only to realize neither of them wanted to pull away when the director shouted cut."
            ],
            "Soulmate AU": [
                "In this world, colors only appear once you touch your soulmate for the very first time. Having lived in a monochromatic world for years, their vision suddenly burst into color when their shoulders brushed in the subway.",
                "Whatever your soulmate speaks appears as ink writing on your skin. One morning, a warm sensation spread across their forearm as a casual greeting was printed there by someone living in the same city.",
                "An hourglass timer tattooed on their wrist counted down the exact seconds until meeting their soulmate. As the final seconds ticked away, the cafe door flew open and a familiar figure walked right inside.",
                "Soulmates share physical pain, meaning one of them kept randomly stumbling or getting paper cuts while sitting quietly at home, knowing their clumsy counterpart was miles away getting into trouble.",
                "In a society where everyone can hear their soulmate's voice inside their head at age eighteen, they spent years trying to locate the owner of the soft, comforting singing voice keeping them company at night."
            ]
        };

        const imageUpload = document.getElementById('image-upload');
        const uploadPreview = document.getElementById('upload-preview');
        const generateBtn = document.getElementById('generate-btn');
        const shipSelect = document.getElementById('ship-select');
        const genreSelect = document.getElementById('genre-select');
        
        const resultSection = document.getElementById('result-section');
        const resultImageContainer = document.getElementById('result-image-container');
        const resultImage = document.getElementById('result-image');
        const badgeShip = document.getElementById('badge-ship');
        const badgeGenre = document.getElementById('badge-genre');
        const promptText = document.getElementById('prompt-text');

        let currentImageUrl = null;

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImageUrl = event.target.result;
                    uploadPreview.src = currentImageUrl;
                    uploadPreview.classList.remove('hidden');
                    uploadPreview.classList.add('block');
                }
                reader.readAsDataURL(file);
            }
        });

        generateBtn.addEventListener('click', function() {
            const selectedShip = shipSelect.value;
            const selectedGenreLabel = genreSelect.options[genreSelect.selectedIndex].text;
            const selectedGenreValue = genreSelect.value;

            const genrePrompts = promptsData[selectedGenreValue];
            const randomIndex = Math.floor(Math.random() * genrePrompts.length);
            let finalPrompt = genrePrompts[randomIndex];
            
            badgeShip.innerText = selectedShip;
            badgeGenre.innerText = selectedGenreLabel;
            promptText.innerText = `"${finalPrompt}"`;

            if (currentImageUrl) {
                resultImage.src = currentImageUrl;
                resultImageContainer.classList.remove('hidden');
                resultImageContainer.classList.add('block');
            } else {
                resultImageContainer.classList.add('hidden');
                resultImageContainer.classList.remove('block');
            }

            resultSection.classList.remove('hidden');
            resultSection.classList.add('flex');
            
            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        });
    </script>
</body>
</html>
