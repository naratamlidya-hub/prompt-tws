<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipper Prompt Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'pastel-pink': '#fdf2f8',
                        'rose-btn': '#e11d48',
                        'rose-hover': '#be123c',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pastel-pink min-h-screen font-sans text-gray-800 antialiased p-6 flex flex-col items-center">

    <header class="text-center mt-8 mb-10">
        <h1 class="text-4xl font-extrabold text-rose-500 mb-2 tracking-tight">Prompt Generator</h1>
        <p class="text-gray-500 text-lg">Temukan ide cerita dan alternate universe untuk ship pilihanmu.</p>
    </header>

    <main class="w-full max-w-lg bg-white p-8 rounded-2xl shadow-[0_8px_30px_rgb(255,228,230,0.8)] border border-pink-100 mb-10 transition-all">
        
        <div class="mb-6">
            <label class="block text-sm font-semibold text-rose-900 mb-2">Upload Visual / Moodboard (Opsional)</label>
            <div class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-pink-200 border-dashed rounded-xl cursor-pointer bg-pink-50 hover:bg-pink-100 transition-colors group overflow-hidden" id="upload-container">
                <input type="file" id="image-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                
                <div id="upload-placeholder" class="flex flex-col items-center justify-center pt-5 pb-6 text-pink-400 group-hover:text-pink-500">
                    <svg class="w-8 h-8 mb-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                    </svg>
                    <p class="text-sm font-medium">Klik atau seret foto ke sini</p>
                </div>

                <img id="upload-preview" src="" alt="Preview" class="hidden absolute inset-0 w-full h-full object-cover z-0 opacity-50" />
            </div>
        </div>

        <div class="mb-5">
            <label for="ship-select" class="block text-sm font-semibold text-rose-900 mb-2">Pilih Karakter / Ship</label>
            <select id="ship-select" class="w-full bg-pink-50 border border-pink-200 text-gray-700 text-md rounded-xl focus:ring-rose-300 focus:border-rose-300 block p-3 outline-none transition-shadow focus:shadow-md">
                <option value="Shinyu & Dohoon">Shinyu & Dohoon</option>
                <option value="Shinyu & Youngjae">Shinyu & Youngjae</option>
                <option value="Shinyu & Jihoon">Shinyu & Jihoon</option>
                <option value="Shinyu & Hanjin">Shinyu & Hanjin</option>
                <option value="Shinyu & Kyungmin">Shinyu & Kyungmin</option>
                
                <option value="Dohoon & Youngjae">Dohoon & Youngjae</option>
                <option value="Dohoon & Jihoon">Dohoon & Jihoon</option>
                <option value="Dohoon & Hanjin">Dohoon & Hanjin</option>
                <option value="Dohoon & Kyungmin">Dohoon & Kyungmin</option>
                
                <option value="Youngjae & Jihoon">Youngjae & Jihoon</option>
                <option value="Youngjae & Hanjin">Youngjae & Hanjin</option>
                <option value="Youngjae & Kyungmin">Youngjae & Kyungmin</option>
                
                <option value="Jihoon & Hanjin">Jihoon & Hanjin</option>
                <option value="Jihoon & Kyungmin">Jihoon & Kyungmin</option>
                
                <option value="Hanjin & Kyungmin">Hanjin & Kyungmin</option>
            </select>
        </div>

        <div class="mb-8">
            <label for="genre-select" class="block text-sm font-semibold text-rose-900 mb-2">Pilih Genre AU</label>
            <select id="genre-select" class="w-full bg-pink-50 border border-pink-200 text-gray-700 text-md rounded-xl focus:ring-rose-300 focus:border-rose-300 block p-3 outline-none transition-shadow focus:shadow-md">
                <option value="Fluff">Fluff</option>
                <option value="Angst">Angst</option>
                <option value="Coffee Shop AU">Coffee Shop AU</option>
                <option value="Enemies to Lovers">Enemies to Lovers</option>
                <option value="School AU">School AU</option>
                <option value="Office Worker AU">Office Worker AU</option>
                <option value="Fake Dating">Fake Dating</option>
                <option value="Soulmate AU">Soulmate AU</option>
            </select>
        </div>

        <button id="generate-btn" class="w-full bg-rose-btn hover:bg-rose-hover text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-rose-200 transition-all transform active:scale-95 text-lg flex justify-center items-center gap-2">
            Acak Prompt
        </button>
    </main>

    <section id="result-section" class="hidden w-full max-w-2xl bg-white rounded-2xl shadow-[0_8px_30px_rgb(255,228,230,0.8)] border border-pink-100 overflow-hidden mb-12">
        <div class="flex flex-col sm:flex-row">
            
            <div id="result-image-container" class="hidden sm:w-2/5 h-64 sm:h-auto overflow-hidden bg-pink-50">
                <img id="result-image" src="" alt="Moodboard" class="w-full h-full object-cover">
            </div>

            <div class="p-8 flex-1 flex flex-col justify-center">
                <div class="flex flex-wrap gap-2 mb-4">
                    <span id="badge-ship" class="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1 rounded-full border border-rose-200"></span>
                    <span id="badge-genre" class="bg-pink-100 text-pink-700 text-xs font-bold px-3 py-1 rounded-full border border-pink-200"></span>
                </div>
                
                <h3 class="text-xl font-bold text-rose-900 mb-3">Skenario:</h3>
                <p id="prompt-text" class="text-gray-600 leading-relaxed italic text-md">
                </p>
            </div>
        </div>
    </section>

    <script>
        const promptsData = {
            "Fluff": [
                "Mereka tak sengaja bertabrakan di lorong, menjatuhkan tumpukan barang yang dibawa. Saat merapikan bersama, punggung tangan mereka bersentuhan, membuat rona merah menjalar di pipi keduanya. Hari itu berakhir dengan senyum dan langkah yang tenang.",
                "Cuaca sangat dingin hari ini, dan salah satu dari mereka lupa membawa syal. Tanpa banyak bicara, sosok di sebelahnya melepas syal tebalnya dan melilitkannya dengan lembut ke leher pasangannya. Genggaman tangan hangat di saku mantel menjadi pelengkap malam itu.",
                "Menghabiskan minggu sore di sofa sambil menonton film kesukaan terdengar biasa saja. Namun ketika kepala yang satu bersandar nyaman di bahu yang lain hingga tertidur, dunia tiba-tiba terasa begitu tenang dan utuh."
            ],
            "Angst": [
                "Hujan turun deras menutupi air mata yang tak bisa lagi ditahan. Ia menatap kepergian sosok itu dengan dada sesak, menyadari bahwa beberapa kisah memang tak ditakdirkan untuk memiliki akhir bahagia. Kalimat perpisahan terakhir itu terus terngiang di kepala.",
                "Ia menatap tiket konser yang dibelinya dengan susah payah berbulan-bulan lalu. Kursi di sebelahnya seharusnya tidak kosong hari ini. Namun takdir berkata lain, meninggalkannya sendirian di tengah riuhnya keramaian.",
                "Pesan singkat itu hanya berisi satu kalimat persetujuan untuk mengakhiri semuanya. Mereka berdua sama-sama tahu bahwa mempertahankan hubungan ini hanya akan saling menyakiti, meski melepaskan terasa jauh lebih berat."
            ],
            "Coffee Shop AU": [
                "Aroma kopi yang pekat menjadi latar pertemuan mereka setiap selasa sore. Pesanannya selalu sama, begitu juga senyum tipis dari balik apron sang barista. Hari ini, ada secarik nomor telepon yang sengaja dituliskan di balik gelas kopinya.",
                "Kopinya terasa terlalu pahit karena sang barista magang salah menakar takaran espresso. Saat ia memprotes, sang barista meminta maaf dengan wajah memerah. Sebagai gantinya, ia mendapat sepotong kue gratis dan perkenalan canggung.",
                "Hujan badai membuat pelanggan terakhir itu tak bisa pulang dan terpaksa menunggu di dalam kedai yang sudah setengah tutup. Pemilik kedai membuatkan dua cangkir cokelat panas, berujung obrolan panjang hingga tengah malam."
            ],
            "Enemies to Lovers": [
                "Berada di satu kelompok tugas adalah mimpi buruk bagi mereka yang tak pernah berhenti berdebat. Namun saat harus menginap bersama demi mengejar tenggat waktu, pertahanan keduanya mulai runtuh secara perlahan.",
                "Kalah dalam taruhan konyol membuat mereka harus berpura-pura menjadi pasangan selama seminggu penuh. Awalnya semua hanya sandiwara penuh keterpaksaan, tapi ketika tangan mereka bertautan di depan umum, batas antara pura-pura dan nyata mulai kabur.",
                "Ia selalu membenci tetangga apartemennya yang berisik setiap akhir pekan. Suatu malam ia menggedor pintu berniat memarahi, namun malah menemukan musuh bebuyutannya itu sedang menghadapi masalah besar."
            ],
            "School AU": [
                "Masa orientasi sekolah terasa sangat membosankan sampai ia melihat senyum cerah dari ketua klub fotografi. Jepretan kamera diam-diam menjadi awal mula kedekatan mereka di bawah pohon rindang sekolah.",
                "Ia selalu tertidur di perpustakaan pada jam istirahat. Setiap kali terbangun, selalu ada sekotak susu dan catatan kecil berisi semangat di atas mejanya. Hari ini, ia memutuskan pura-pura tidur demi menangkap basah pengagum rahasianya.",
                "Keduanya adalah murid berprestasi yang selalu bersaing memperebutkan peringkat pertama. Saat ujian akhir semakin dekat, mereka diam-diam sepakat bertemu di atap sekolah untuk belajar bersama."
            ],
            "Office Worker AU": [
                "Terjebak di dalam lift kantor yang rusak selama dua jam memaksa dua rekan kerja yang selama ini jarang akur untuk saling terbuka membicarakan tekanan hidup dan impian rahasia mereka.",
                "Sebagai asisten manajer yang perfeksionis, ia selalu dibuat pusing oleh atasannya yang santai namun brilian. Di balik meja kantor yang kaku, dokumen laporan sering diselipi catatan kecil yang bernada usil.",
                "Lembur hingga larut malam di gedung perkantoran yang kosong menyisakan mereka berdua di lantai tiga. Secangkir kopi hangat dari mesin otomatis menjadi awal dari percikan rasa yang tak terduga."
            ],
            "Fake Dating": [
                "Demi menghindari perjodohan keluarga yang melelahkan, mereka sepakat membuat kontrak hubungan palsu. Aturan utamanya sederhana: jangan sampai baper. Sialnya, aturan itu justru mulai dilanggar sejak hari ketiga.",
                "Tampil bersama di acara reuni sebagai pasangan sukses mengelabui semua orang. Namun di perjalanan pulang dalam taksi yang sunyi, keheningan di antara mereka terasa jauh lebih intens daripada sandiwara tadi.",
                "Sebuah foto tidak sengaja tertangkap kamera paparazzi dan langsung menjadi berita utama nasional. Alih-alih membantah, mereka memutuskan melanjutkan sandiwara romantis ini demi kepentingan bersama."
            ],
            "Soulmate AU": [
                "Di dunia ini, warna dunia akan menjadi nyata hanya ketika kamu menyentuh soulmate-mu untuk pertama kali. Selama bertahun-tahun ia hidup dalam dunia hitam putih, hingga tak sengaja bahunya bersenggolan dengan seseorang di stasiun.",
                "Setiap kata yang diucapkan soulmate-mu akan muncul sebagai tulisan di kulit lenganmu. Hari ini, lengan kirinya tiba-tiba terasa hangat saat sebuah kalimat sapaan tercetak di sana, ditulis oleh seseorang di kota yang sama.",
                "Tanda jam pasir di pergelangan tangan terus menghitung mundur detik-detik pertemuan dengan soulmate. Ketika jarum penunjuk waktunya habis, pintu kafe tempatnya bekerja terbuka dan sesosok figur familiar melangkah masuk."
            ]
        };

        const imageUpload = document.getElementById('image-upload');
        const uploadPreview = document.getElementById('upload-preview');
        const generateBtn = document.getElementById('generate-btn');
        const shipSelect = document.getElementById('ship-select');
        const genreSelect = document.getElementById('genre-select');
        
        const resultSection = document.getElementById('result-section');
        const resultImageContainer = document.getElementById('result-image-container');
        const resultImage = document.getElementById('result-image');
        const badgeShip = document.getElementById('badge-ship');
        const badgeGenre = document.getElementById('badge-genre');
        const promptText = document.getElementById('prompt-text');

        let currentImageUrl = null;

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImageUrl = event.target.result;
                    uploadPreview.src = currentImageUrl;
                    uploadPreview.classList.remove('hidden');
                    uploadPreview.classList.add('block');
                }
                reader.readAsDataURL(file);
            }
        });

        generateBtn.addEventListener('click', function() {
            const selectedShip = shipSelect.value;
            const selectedGenreLabel = genreSelect.options[genreSelect.selectedIndex].text;
            const selectedGenreValue = genreSelect.value;

            const genrePrompts = promptsData[selectedGenreValue];
            const randomIndex = Math.floor(Math.random() * genrePrompts.length);
            let finalPrompt = genrePrompts[randomIndex];
            
            badgeShip.innerText = selectedShip;
            badgeGenre.innerText = selectedGenreLabel;
            promptText.innerText = `"${finalPrompt}"`;

            if (currentImageUrl) {
                resultImage.src = currentImageUrl;
                resultImageContainer.classList.remove('hidden');
                resultImageContainer.classList.add('block');
            } else {
                resultImageContainer.classList.add('hidden');
                resultImageContainer.classList.remove('block');
            }

            resultSection.classList.remove('hidden');
            resultSection.classList.add('flex');
            
            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        });
    </script>
</body>
</html>
